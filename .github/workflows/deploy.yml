name: Deploy ERMAK Site

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Execute deploy on server
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: 108.165.164.85
        username: root
        key: ${{ secrets.SSH_KEY_HERMES }}
        script: |
          cd /root/ermak-site
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          rsync -a dist/ /var/www/ermak-site/dist/
          cp server/server.js /var/www/ermak-site/server.cjs
          systemctl restart ermak-site.service 2>/dev/null || true
          nginx -t && systemctl reload nginx 2>/dev/null || true
