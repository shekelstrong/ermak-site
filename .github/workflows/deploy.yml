name: Deploy ERMAK Site

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Execute deploy on server
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.HOST_ERMAK }}
        username: ${{ secrets.USERNAME_ERMAK }}
        key: ${{ secrets.SSH_KEY_ERMAK }}
        script: |
          cd /root/ermak-site
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          cp -r dist/* /var/www/ermak-site/dist/
          cp server/server.js /var/www/ermak-site/server.js
          cp package.json /var/www/ermak-site/package.json 2>/dev/null || true
          cd /var/www/ermak-site && npm ci 2>/dev/null || true
          systemctl restart ermak-site.service 2>/dev/null || true
          # Restart nginx too
          nginx -t && systemctl reload nginx 2>/dev/null || true
